<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Add Listing - CK Real Estate</title>
</head>
<body>
  <h1>Add New Listing</h1>

  {% for message in messages %}
    <p>{{ message }}</p>
  {% endfor %}

  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Save Listing</button>
  </form>
</body>
</html>
